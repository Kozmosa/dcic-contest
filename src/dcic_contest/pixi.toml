[workspace]
authors = ["Kozmosa <kozmosa@proton.me>"]
channels = ["conda-forge"]
name = "dcic_contest"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
data-audit = "PYTHONPATH=../.. python ../../scripts/run_data_audit.py"
backtest-baselines = "PYTHONPATH=../.. python ../../scripts/run_backtest.py"
backtest-lightgbm = "PYTHONPATH=../.. python ../../scripts/run_backtest.py --models lightgbm_recursive"
run-baseline-experiment = "PYTHONPATH=../.. python ../../scripts/run_baseline_experiment.py"

[dependencies]
python = "3.11.*"
pandas = ">=3.0.1,<4"
numpy = ">=2.4.3,<3"
scikit-learn = ">=1.8.0,<2"
matplotlib = ">=3.10.8,<4"
seaborn = ">=0.13.2,<0.14"
lightgbm = ">=4.6.0,<5"
